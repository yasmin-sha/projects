<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do list</title>
   
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="todo-container">
        <h1>My To-Do List</h1>
        <p>Orgaanize your day, one task at a time.</p>
        <form id="todo-form">
            <input id="task-input"
             type="text"
              placeholder="Enter your task"
              required
              >
            <button id="add-btn"
            type="submit">
            Add Task</button>
        </form>
        
        <ul id="task-list"></ul>
    </main>

    <script src="java.js"></script>


</body>
</html>
